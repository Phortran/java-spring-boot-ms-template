import com.github.spotbugs.snom.Effort
import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

buildscript {
	ext {
		springVersion    = '3.5.9'
		jooqVersion      = '3.20.10'
		mapStructVersion = '1.6.3'
        flywaydbVersion  = '11.20.0'
	}
}

plugins {
	id 'java'
	id 'jvm-test-suite'
	id 'checkstyle'
	id 'jacoco'
	id 'org.springframework.boot' version "$springVersion"//bom
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.flywaydb.flyway' version "$flywaydbVersion"//bom
	id 'org.jooq.jooq-codegen-gradle' version "$jooqVersion"//bom
	id 'org.openapi.generator' version '7.18.0'//bom
	id 'com.github.spotbugs' version '6.1.6'//bom
}

group = 'com.panopticode'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

apply from: 'jooq/jooq.gradle'

dependencies {
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// MapStruct
	compileOnly "org.mapstruct:mapstruct:$mapStructVersion"//bom
	annotationProcessor "org.mapstruct:mapstruct-processor:$mapStructVersion"//bom

	// Logging
	implementation 'org.slf4j:slf4j-api:2.0.17' //bom
	implementation 'ch.qos.logback:logback-classic' //bom
	implementation 'ch.qos.logback:logback-core' //bom
	implementation 'ch.qos.logback.access:logback-access-common:2.0.7' //bom
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.10.0'//bom


	// Spring
	implementation 'org.springframework.boot:spring-boot-starter-jooq'//bom
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'//bom
	implementation 'org.springframework.boot:spring-boot-starter-web'//bom
	implementation 'org.springframework.data:spring-data-jpa'//bom
    implementation 'org.springframework.boot:spring-boot-starter-actuator'//bom

	// Persistence
	implementation "org.flywaydb:flyway-core:$flywaydbVersion"//bom
	implementation "org.flywaydb:flyway-database-postgresql:$flywaydbVersion"//bom
	implementation "org.jooq:jooq:$jooqVersion"//bom

	// Additional dependencies for OpenAPI
	implementation 'org.openapitools:jackson-databind-nullable:0.2.8'//bom
	implementation 'org.springdoc:springdoc-openapi-ui:1.8.0'//bom

	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	jooqCodegen 'org.postgresql:postgresql:42.7.5'
	jooqCodegen 'org.glassfish.jaxb:jaxb-runtime:4.0.6'

	runtimeOnly 'org.postgresql:postgresql:42.7.5'

	// Checks
	spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'

	// Custom checks
	checkstyle project(':custom-checks')
}

ext['junit-jupiter.version'] = '5.12.0'

testing {
	suites {
		test {
			useJUnitJupiter()

			dependencies {
				implementation project(':test-common')
				implementation platform('org.junit:junit-bom:6.0.1')//bom
				implementation 'org.assertj:assertj-core:3.27.6'//bom
				implementation 'org.mockito:mockito-core:5.21.0'//bom
				implementation 'org.mockito:mockito-junit-jupiter:5.21.0'//bom

				runtimeOnly 'org.junit.platform:junit-platform-launcher'
			}

			sources {
				java {
					srcDirs = ['src/test/unit/java']
				}
				resources {
					srcDirs = ['src/test/resources']
				}
			}
		}

		integrationTest(JvmTestSuite) {
			dependencies {
				implementation project(':')
				implementation project(':test-common')
				implementation 'org.springframework.boot:spring-boot-starter-test'//bom
				implementation 'org.springframework.boot:spring-boot-testcontainers'//bom
				implementation 'org.springframework:spring-tx:7.0.2'//bom
				implementation 'org.testcontainers:junit-jupiter:1.21.4'//bom
				implementation 'org.testcontainers:postgresql:1.21.4'//bom
				implementation "org.jooq:jooq:$jooqVersion"//bom
				implementation "org.flywaydb:flyway-core:$flywaydbVersion"//bom
			}

			sources {
				java {
					srcDirs = ['src/test/integration/java']
				}
				resources {
					srcDirs = ['src/test/resources']
				}
			}

			targets {
				configureEach {
					testTask.configure {
						shouldRunAfter(test)
					}
				}
			}
		}
	}
}

tasks.named('check') {
	dependsOn(testing.suites.integrationTest)
}

// Idk why the jvm-test-suite seems to ungroup the checkstyle tasks
tasks.withType(Checkstyle.class).configureEach {
	group = 'Verification'
}

test {
	jacoco {
		classDumpDir = layout.buildDirectory.dir('jacoco/unit/classpathdumps').get().asFile
	}

	finalizedBy jacocoTestReport
}

integrationTest {
	jacoco {
		classDumpDir = layout.buildDirectory.dir('jacoco/integration/classpathdumps').get().asFile
	}

	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = '0.8.11'
}

jacocoTestReport {
	dependsOn test
	sourceSets sourceSets.main
	executionData fileTree(project.rootDir.absolutePath).include("build/jacoco/*.exec")

	reports {
		html.required = true
	}

	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
					"com/panopticode/openapi/**",
					"com/panopticode/jooq/**"
			])
		}))
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 0.85
			}
		}

		rule {
			enabled = false
			element = 'CLASS'
			includes = ['com.panopticode.example.*']

			limit {
				counter = 'LINE'
				value = 'TOTALCOUNT'
				maximum = 0.3
			}
		}
	}
}

bootRun {
	systemProperties = System.properties
}

checkstyle {
	toolVersion = '10.14.2'
}

//import com.github.spotbugs.snom.Confidence
spotbugs {
	toolVersion = '4.8.3'
	ignoreFailures = false
	showStackTraces = true
	showProgress = true
	effort = Effort.MAX
//	reportLevel = Confidence.DEFAULT
//	visitors = listOf("FindSqlInjection", "SwitchFallthrough")
//	omitVisitors = listOf("FindNonShortCircuit")
//	reportsDir = file("$buildDir/spotbugs")
//	includeFilter = file("include.xml")
	excludeFilter = file("$projectDir/config/spotbugs/exclude.xml")
//	baselineFile = file("baseline.xml")
//	onlyAnalyze = listOf("com.foobar.MyClass", "com.foobar.mypkg.*")
//	maxHeapSize = "1g"
//	extraArgs = listOf("-nested:false")
//	jvmArgs = listOf("-Duser.language=ja")
}

tasks.spotbugsMain {
	reports.create("html") {
		required = true
//		outputLocation = file("$buildDir/reports/spotbugs.html")
		setStylesheet("fancy-hist.xsl")
	}
}

// These should be passed via env vars that are known at deployment time
flyway {
	url = 'jdbc:postgresql://localhost:5432/example-db'
	user = 'root'
	password = 'local-dev-only'
}

tasks.register('bundleApiSpecs', Exec) {
    description = 'Bundle all the api specs into one file'
    group = 'OpenAPI Tools'

    commandLine 'docker', 'run',
            '--rm',
            '-v', "$projectDir/api:/spec",
            'redocly/cli:2.12.6',
            'bundle',
            'src/openapi.yaml',
            '-o', 'dist/openapi.yaml'

    outputs.file(layout.projectDirectory.file('api/dist/openapi.yaml'))
}

// This task is an internal utility and it's not polished
// it reads the specs at api/cookbook/openapi.yaml and create the documents
// inside api/cookbook/. The openapi.yaml rooted there needs to be
// moved where the original was and all the $refs fixed.
tasks.register('splitApiSpecs', Exec) {
	description = 'Split the full API spec in the openapi.yaml'

	commandLine 'docker', 'run',
			'--rm',
			'-v', "$projectDir/api:/spec",
            'redocly/cli:2.12.6',
			'split',
            'dist/openapi.yaml',
			'--outDir', 'src/cookbook'
}

tasks.register('checkOpenApiContract', Exec) {
    mkdir 'build/openApiCheck'

    commandLine 'scripts/openapi-check.sh'
}

tasks.named('check') {
    dependsOn(checkOpenApiContract)
}

openApiValidate {
    inputSpec.set("$projectDir/api/src/openapi.yaml")
	recommend.set(true)
}

tasks.named('openApiValidate') {
	dependsOn(bundleApiSpecs)
}

openApiGenerate {
	verbose.set(true)
	generatorName.set('spring')
	outputDir.set("$projectDir")
    inputSpecRootDirectory.set("$projectDir/api/dist")
    inputSpec.set("$projectDir/api/dist/openapi.yaml")
	invokerPackage.set('com.panopticode.openapi')
	apiPackage.set('com.panopticode.openapi.api')
	modelPackage.set('com.panopticode.openapi.model')
	configOptions = [
			useSpringBoot3      : 'true',
			delegatePattern     : 'true',
			useTags             : 'true',
			library             : 'spring-boot',
			requestMappingMode  : 'controller',
			booleanGetterPrefix : 'is',
			configPackage       : 'com.panopticode.openapi.configuration',
			sourceFolder        : 'src/main/java/generated',
			title               : 'java-spring-boot-ms-template_OpenAPI',
	]
}

tasks.named('openApiGenerate') {
	dependsOn(bundleApiSpecs)
}

tasks.register('generateDocs', GenerateTask) {
	description = 'Generate html documentation of the java-spring-boot-ms-template public API using the OpenAPI engine.'
	group = 'OpenAPI Tools'

	dependsOn bundleApiSpecs
	generatorName.set('html2')
	outputDir.set("$projectDir/docs")
    inputSpec.set("$projectDir/api/dist/openapi.yaml")
	configOptions = [
			appName        : 'java-spring-boot-ms-template',
			appDescription : 'A template code base for a java Spring Boot micro-service, with database versioning, a RESTful API defined and documented using OpenAPI and a compelling test suite.',
			artifactVersion: '1.0.0',
			infoEmail      : 'sink@etlgr.com',
			infoUrl        : 'https://www.wikipedia.org',
			licenseInfo    : 'GPL v3',
			licenseUrl     : 'https://www.gnu.org/licenses/gpl-3.0.en.html',
	]
}

tasks.register('printSourceSetInformation') {
	description = 'Print information about the source sets in this project and their classpaths.'
	group = 'Help'

	doLast{
		sourceSets.each { srcSet ->
			println "["+srcSet.name+"]"
			print "-->Source directories: "+srcSet.allJava.srcDirs+"\n"
			print "-->Output directories: "+srcSet.output.classesDirs.files+"\n"
			print "-->Compile classpath:\n"
			srcSet.compileClasspath.files.each {
				print "  "+it.path+"\n"
			}
			println ""
		}
	}
}
